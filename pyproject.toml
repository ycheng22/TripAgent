[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripagent"
version = "0.1.0"
description = "TripAgent P2 Core"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi",
    "uvicorn",
    "langgraph>=0.2.0",
    "retrieval-core @ git+https://github.com/ycheng22/RetrievalCore.git@c9e6a9bce1167e16295eef3005ec93ba3d8715c5",
    "mcp>=1.0.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "openai>=3.35.1",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
    "httpx"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "adapters", "providers"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

name: Deploy TripAgent

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripagent-production-deploy
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check app core adapters providers
      - name: Type check core
        run: uv run mypy core
      - name: Test
        run: uv run pytest

  deploy-backend:
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      cloud-run-url: ${{ steps.cloud-run.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build and push backend image
        env:
          IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          docker build --tag "$IMAGE_URI:${{ github.sha }}" .
          docker push "$IMAGE_URI:${{ github.sha }}"
      - id: cloud-run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          env_vars: |-
            GIT_SHA=${{ github.sha }}
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          env_vars_update_strategy: overwrite
          secrets: |-
            OPENAI_API_KEY=${{ vars.OPENAI_API_KEY_SECRET_NAME }}:latest
            GEMINI_API_KEY=${{ vars.GEMINI_API_KEY_SECRET_NAME }}:latest
            DEEPSEEK_API_KEY=${{ vars.DEEPSEEK_API_KEY_SECRET_NAME }}:latest
          secrets_update_strategy: overwrite
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=3

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Angular frontend
        working-directory: ./web
        env:
          API_BASE_URL: ${{ needs.deploy-backend.outputs.cloud-run-url }}
        run: |
          npm ci
          npm run build -- --configuration production
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --production-branch=main
      - name: Ensure Cloudflare custom domain exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/domains"
          existing="$(curl --fail-with-body --silent --show-error "$endpoint" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          if jq --exit-status --arg domain "$CUSTOM_DOMAIN" '.result[] | select(.name == $domain)' <<<"$existing" > /dev/null; then
            exit 0
          fi
          payload="$(jq --null-input --compact-output --arg name "$CUSTOM_DOMAIN" '{name: $name}')"
          curl --fail-with-body --silent --show-error --request POST "$endpoint" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json" --data "$payload"
      - name: Ensure Cloudflare Pages DNS record exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
          PAGES_PROJECT_DOMAIN: ${{ vars.CLOUDFLARE_PAGES_PROJECT_DOMAIN }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records"
          existing="$(curl --fail-with-body --silent --show-error --get "$endpoint" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --data-urlencode "type=CNAME" --data-urlencode "name=${CUSTOM_DOMAIN}")"
          record_count="$(jq '.result | length' <<<"$existing")"
          if [ "$record_count" -gt 0 ]; then
            existing_target="$(jq --raw-output '.result[0].content' <<<"$existing")"
            if [ "$existing_target" != "$PAGES_PROJECT_DOMAIN" ]; then
              echo "Refusing to replace existing DNS record for ${CUSTOM_DOMAIN}." >&2
              exit 1
            fi
            exit 0
          fi
          payload="$(jq --null-input --compact-output --arg name "$CUSTOM_DOMAIN" --arg content "$PAGES_PROJECT_DOMAIN" '{type: "CNAME", name: $name, content: $content, proxied: true, ttl: 1}')"
          curl --fail-with-body --silent --show-error --request POST "$endpoint" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json" --data "$payload"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist/web/browser --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

name: Keep TripAgent Warm

on:
  schedule:
    - cron: "*/10 12-23 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tripagent-keepalive
  cancel-in-progress: true

jobs:
  ping-keepalive:
    if: vars.CLOUD_RUN_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping application keepalive endpoint
        env:
          CLOUD_RUN_URL: ${{ vars.CLOUD_RUN_URL }}
        run: curl --fail --silent --show-error --max-time 10 "${CLOUD_RUN_URL}/ping" > /dev/null
